# ── Production Profile Overrides ─────────────────────────────────────────────
# Active when: SPRING_PROFILES_ACTIVE=prod
# All secrets MUST come from environment variables — never hardcode here.
# This file is listed in .gitignore — keep it out of version control.

server:
  error:
    include-message: never    # Never leak internal error details to clients

spring:
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema — validate only, never create
    properties:
      hibernate.format_sql: false

  flyway:
    repair-on-migrate: false  # Checksum mismatches must be investigated, not silenced

# ── Logging (production — no DEBUG) ──────────────────────────────────────────
logging:
  level:
    root: WARN
    org.springframework.security: WARN
    org.flywaydb: INFO
    com.college.gatepass: INFO

# ── Swagger/OpenAPI — disable in production ───────────────────────────────────
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# ── Actuator — restrict in production ────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # Only expose health and prometheus — never expose env, beans, etc.
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized