#application.yml
server:
  port: ${PORT:8080}
  error:
    include-message: never   # production-ready: client ko stacktrace mat dikhao

spring:
  application:
    name: gatepass-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gatepass?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:YourStrongPassword}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
#      ddl-auto: validate
    ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    repair-on-migrate: false   # production mein kabhi auto-repair nahi

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

app:
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-must-be-at-least-32-bytes-long-secret-key!}
    access-ttl-minutes: 30
    refresh-ttl-days: 14
  pass:
    default-ttl-hours: 24
    qr-hmac-secret: ${QR_HMAC_SECRET:another-very-long-secret-for-qr-signing-change-in-prod!}
  rate-limit:
    auth-requests-per-minute: 10
  mail:
    from-name: "Gate Pass System"
    from-address: ${MAIL_FROM:no-reply@gatepass.college.edu}
    enabled: ${MAIL_ENABLED:false}    # production me true hoga, dev me false

